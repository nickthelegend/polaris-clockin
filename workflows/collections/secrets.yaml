# polaris-collections' CRE secrets: secret id -> the environment variables that
# hold it in simulation (the project root's .env, or the shell). Deployed
# workflows read it from the Vault DON (`cre secrets create ./secrets.yaml`
# from the project root stores it with the underwriting keys). Nothing here is
# a value.
#
# The signed run callback's HMAC key, shared with the Polaris API. Read only
# when config.callback is set; when it is empty the run logs "callback skipped"
# and sends nothing unsigned.
secretsNames:
  POLARIS_CALLBACK_SECRET:
    - POLARIS_CALLBACK_SECRET
