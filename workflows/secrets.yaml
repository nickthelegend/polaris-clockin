# CRE secret ids -> the environment variables that hold them in simulation
# (./.env or the shell). Deployed workflows read them from the Vault DON:
#   cre secrets create ./secrets.yaml -T production-settings --secrets-auth=browser
# Nothing here is a value. See .env.example.
secretsNames:
  NANSEN_API_KEY:
    - NANSEN_API_KEY
  ZERION_API_KEY:
    - ZERION_API_KEY
  ETHERSCAN_API_KEY:
    - ETHERSCAN_API_KEY
  POLARIS_CALLBACK_SECRET:
    - POLARIS_CALLBACK_SECRET
