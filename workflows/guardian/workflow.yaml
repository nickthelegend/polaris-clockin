# CRE workflow settings for `guardian`, one block per target in ../project.yaml.
# workflow-name is what the production forwarder carries (as the bytes10 of its
# sha256, 0x64383734313635346335) and what GuardianReceiver.setExpectedWorkflowName
# checks. The guardian reads no secrets; secrets-path is kept for a uniform CLI.

local-settings:
  user-workflow:
    workflow-name: "polaris-guardian"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.local.json"
    secrets-path: "../secrets.yaml"

staging-settings:
  user-workflow:
    workflow-name: "polaris-guardian"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../secrets.yaml"

production-settings:
  user-workflow:
    workflow-name: "polaris-guardian"
    deployment-registry: "private"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "../secrets.yaml"
