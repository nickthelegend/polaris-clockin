[toolchain]
anchor_version = "0.32.1"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
polaris = "HL4FgsM51RQQis74TwDkK733ZcTDnqWF8L772Y7tFVaA"

[programs.devnet]
polaris = "HL4FgsM51RQQis74TwDkK733ZcTDnqWF8L772Y7tFVaA"

[provider]
cluster = "localnet"
wallet = "keys/deployer.json"

[test]
startup_wait = 10000

[test.validator]
bind_address = "127.0.0.1"
rpc_port = 4270
# every port stays inside polaris' range (4200-4299)
gossip_port = 4272
faucet_port = 4273
dynamic_port_range = "4274-4299"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
