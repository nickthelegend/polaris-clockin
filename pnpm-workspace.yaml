packages:
  - "packages/*"
  # The Envio indexer is installed on its own, from Linux (WSL or CI), with
  # `pnpm install --ignore-workspace`: the `envio` CLI has no Windows build and
  # Envio Cloud uploads only that folder. Its GraphQL client is an ordinary
  # workspace package the dashboard, webhooks and CRE workflows import.
  - "!packages/indexer"
  - "packages/indexer/client"
  - "apps/*"
  # The Solana port installs on its own with npm (Anchor tests, the Expo app,
  # the coach server): see clockin/PORT-PLAN.md and HANDOFF.md.
  - "!packages/solana"
  - "!apps/mobile"
  - "!apps/coach"
  - "services/*"
  - "workflows"

# Packages whose install scripts may run. `bun` puts its platform binary in
# place; the CRE workflows compile to WASM with it (workflows/README.md).
onlyBuiltDependencies:
  - bun

# @chainlink/cre-sdk's compile step (cre-compile, which `cre workflow build`
# and `simulate` run) imports `typescript` without declaring it, so it got
# whichever copy pnpm hoisted: packages/contracts' TypeScript 7, whose
# package has no compiler API ("ts.ScriptTarget" is undefined). Give it the
# TypeScript 5 every other package uses.
packageExtensions:
  "@chainlink/cre-sdk":
    dependencies:
      typescript: "^5.9.3"
